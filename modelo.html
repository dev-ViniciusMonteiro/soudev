<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinicius Monteiro Orlandi | 3D Tech Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body class="relative text-white">

    <div id="login-screen" class="absolute inset-0 flex items-center justify-center z-50 bg-slate-950 bg-opacity-95 p-4">
        <div class="glass-panel p-8 max-w-md w-full rounded-2xl shadow-2xl text-center border-sky-500/40">
            <div class="text-4xl mb-3">🏎️</div>
            <h1 class="text-2xl font-extrabold text-sky-400 mb-2">VMAI 3D EXPERIENCE</h1>
            <p class="text-xs text-slate-300 mb-6">Explore a carreira de <strong class="text-white">Vinicius Monteiro Orlandi</strong> (Tech Lead & AI Expert) em um ambiente 3D imersivo.</p>
            <input type="text" id="username" placeholder="Digite seu nome ou codinome..." class="w-full p-3 bg-slate-900 border border-slate-700 text-white rounded-lg mb-4 focus:outline-none focus:border-sky-400 text-center text-sm font-semibold">
            <button onclick="initExperience()" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-slate-950 font-bold p-3 rounded-lg transition shadow-lg shadow-sky-500/20">ENTRAR NA CIDADE 3D 🚀</button>
        </div>
    </div>

    <div id="game-hud" class="hidden absolute top-0 left-0 w-full p-6 flex justify-between items-start pointer-events-none z-10">
        <div class="glass-panel p-4 rounded-xl pointer-events-auto max-w-xs shadow-lg">
            <h2 id="player-title" class="text-sm font-bold text-sky-400">Piloto</h2>
            <p class="text-xs text-slate-300 mt-1">Use as setas do teclado ou clique nos blocos 3D para pilotar até os marcos da carreira.</p>
            <div class="mt-3 flex gap-2">
                <button onclick="moveCar('forward')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded text-xs border border-slate-600">⬆️ Acelerar</button>
                <button onclick="resetCar()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded text-xs border border-slate-600">🔄 Centralizar</button>
            </div>
        </div>

        <div class="glass-panel p-4 rounded-xl pointer-events-auto text-right shadow-lg">
            <span class="text-xs text-amber-400 font-semibold">📍 Marcos Explorados: <span id="progress-count">0</span>/4</span>
            <div class="mt-2">
                <a href="https://www.linkedin.com/in/vinicius-monteiro-orlandi/" target="_blank" class="text-xs text-sky-400 hover:underline block">LinkedIn</a>
                <a href="https://github.com/dev-ViniciusMonteiro/" target="_blank" class="text-xs text-sky-400 hover:underline block">GitHub</a>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="career-modal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-40">
        <div class="glass-panel p-8 max-w-lg w-full rounded-2xl relative border-sky-400">
            <span id="modal-tag" class="inline-block bg-sky-950 text-sky-300 text-xs px-3 py-1 rounded-full mb-3 border border-sky-800 font-semibold"></span>
            <h3 id="modal-title" class="text-2xl font-bold text-white mb-3"></h3>
            <p id="modal-desc" class="text-slate-300 text-sm leading-relaxed mb-6"></p>
            <button onclick="closeModal()" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-lg transition">CONTINUAR JORNADA 🏎️</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, car, buildings = [];
        let visitedMilestones = new Set();
        let targetCarPosition = 0;

        const careerMilestones = [
            {
                id: 'unifaj',
                title: 'Universidade UNIFAJ',
                category: 'Formação Acadêmica',
                desc: 'Formado em Ciência da Computação. Onde nasceu a forte paixão por lógica, computadores e resolução de problemas estruturados.'
            },
            {
                id: 'compass',
                title: 'Compass UOL (Tech Lead)',
                category: 'Engenharia & Liderança (2021+)',
                desc: 'Atuação como Software Engineer Fullstack e Tech Lead em projetos estratégicos para marcas como Qualicorp, UOL EdTech, Yamaha, Fugini, PortInfo e Real Distribuidora.'
            },
            {
                id: 'natura',
                title: 'Natura & Avon LATAM',
                category: 'E-commerce & Grandes Contas',
                desc: 'Liderança e entregas técnicas de alto impacto para o ecossistema digital e operações de beleza em toda a América Latina.'
            },
            {
                id: 'center_norte',
                title: 'Cidade Center Norte (2026)',
                category: 'Liderança Técnica Atual',
                desc: 'Liderança de duas equipes em São Paulo. Criação do e-commerce de vagas de estacionamento e coordenação do app integrador de Shopping, Cidade, NovoHotel e Lar Center.'
            }
        ];

        function initExperience() {
            const name = document.getElementById('username').value.trim();
            if (!name) return alert('Por favor, informe seu nome!');

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-hud').classList.remove('hidden');
            document.getElementById('player-title').innerText = `Piloto: ${name}`;

            setupThreeJS();
        }

        function setupThreeJS() {
            const container = document.getElementById('canvas-container');

            // Cena, Câmera e Renderizador
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 14);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Luzes Realistas
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.5);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Pista / Estrada
            const roadGeometry = new THREE.PlaneGeometry(8, 120);
            const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            scene.add(road);

            // Carrinho 3D estilizado (Low Poly / Moderno)
            const carGroup = new THREE.Group();
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 3), bodyMat);
            body.position.y = 0.5;
            body.castShadow = true;
            carGroup.add(body);

            const topMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.5, roughness: 0.1 });
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 1.6), topMat);
            cabin.position.set(0, 1.0, -0.2);
            cabin.castShadow = true;
            carGroup.add(cabin);

            car = carGroup;
            car.position.set(0, 0, 10);
            scene.add(car);

            // Prédios / Marcos 3D posicionados ao longo da pista
            const buildingGeo = new THREE.BoxGeometry(2.5, 6, 2.5);
            
            careerMilestones.forEach((milestone, index) => {
                const zPos = 4 - (index * 8);
                const xPos = index % 2 === 0 ? -4.5 : 4.5;

                const color = index === 3 ? 0xf59e0b : (index === 2 ? 0xec4899 : 0x6366f1);
                const bMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.6 });
                const building = new THREE.Mesh(buildingGeo, bMat);
                
                building.position.set(xPos, 3, zPos);
                building.castShadow = true;
                building.receiveShadow = true;
                building.userData = milestone;
                
                scene.add(building);
                buildings.push(building);
            });

            // Eventos de clique no ambiente 3D
            window.addEventListener('click', onDocumentMouseDown, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Suaviza o movimento do carrinho
            car.position.z += (targetCarPosition - car.position.z) * 0.05;

            // Camera acompanha o carrinho suavemente
            camera.position.z = car.position.z + 10;

            renderer.render(scene, camera);
        }

        function moveCar(direction) {
            if (direction === 'forward') {
                targetCarPosition -= 8;
                if (targetCarPosition < -20) targetCarPosition = 10; // Loop na pista
            }
        }

        function resetCar() {
            targetCarPosition = 10;
        }

        function onDocumentMouseDown(event) {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(buildings);

            if (intersects.length > 0) {
                const clickedBuilding = intersects[0].object;
                const data = clickedBuilding.userData;
                openModal(data);
            }
        }

        function openModal(milestone) {
            document.getElementById('modal-tag').innerText = milestone.category;
            document.getElementById('modal-title').innerText = milestone.title;
            document.getElementById('modal-desc').innerText = milestone.desc;
            document.getElementById('career-modal').classList.remove('hidden');

            if (!visitedMilestones.has(milestone.id)) {
                visitedMilestones.add(milestone.id);
                document.getElementById('progress-count').innerText = visitedMilestones.size;
            }
        }

        function closeModal() {
            document.getElementById('career-modal').classList.add('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
