<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#20304a" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>MonKePo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #101820; color: #fff;
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 6px; }
      #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
        background: rgba(10, 20, 40, .55); }
      #login[hidden] { display: none; }
      #login .card { width: 100%; max-width: 340px; background: #f8f8f8; color: #303030; border: 4px solid #4a6a9a;
        border-radius: 12px; padding: 20px; box-shadow: 0 0 0 3px #283848, 0 12px 30px rgba(0,0,0,.4); user-select: text; }
      #login h1 { font-size: 26px; color: #305080; margin-bottom: 4px; }
      #login p.sub { font-size: 13px; color: #607080; margin-bottom: 14px; }
      #login label { display: block; font-size: 13px; font-weight: bold; margin: 10px 0 4px; }
      #login input { width: 100%; font-size: 16px; padding: 10px; border: 2px solid #b8c8d8; border-radius: 8px; }
      #login input:focus { outline: none; border-color: #4a6a9a; }
      #login button { margin-top: 16px; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: #fff;
        background: #e05050; border: 0; border-radius: 8px; cursor: pointer; }
      #login button:disabled { opacity: .6; cursor: wait; }
      #erro { min-height: 18px; margin-top: 10px; font-size: 13px; color: #c03030; }
      #login small { display: block; margin-top: 8px; font-size: 12px; color: #708090; line-height: 1.4; }
      #pad { width: 100%; max-width: 520px; height: 160px; position: relative; flex: none; margin-top: 6px; }
      #pad[hidden] { display: none; }
      #pad [data-btn] { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold;
        color: #fff; background: #34445a; border: 2px solid #56708e; user-select: none; touch-action: none; }
      #pad [data-btn].on { background: #56708e; }
      .dpad { width: 52px; height: 52px; border-radius: 10px; font-size: 20px; }
      [data-btn="up"] { left: 70px; top: 4px; } [data-btn="down"] { left: 70px; top: 104px; }
      [data-btn="left"] { left: 16px; top: 54px; } [data-btn="right"] { left: 124px; top: 54px; }
      .round { width: 64px; height: 64px; border-radius: 50%; font-size: 22px; }
      [data-btn="a"] { right: 18px; top: 26px; background: #b83838 !important; } [data-btn="b"] { right: 96px; top: 66px; background: #4a5a9a !important; }
      [data-btn="start"] { left: 50%; transform: translateX(-50%); bottom: 4px; width: 84px; height: 30px; border-radius: 15px; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="pad" hidden>
      <div class="dpad" data-btn="up">▲</div>
      <div class="dpad" data-btn="left">◀</div>
      <div class="dpad" data-btn="right">▶</div>
      <div class="dpad" data-btn="down">▼</div>
      <div class="round" data-btn="b">B</div>
      <div class="round" data-btn="a">A</div>
      <div data-btn="start">START</div>
    </div>
    <form id="login" hidden autocomplete="on">
      <div class="card">
        <h1>MonKePo</h1>
        <p class="sub">Entre para salvar seus MonKePos e disputar o ranking.</p>
        <label for="usuario">Usuário</label>
        <input id="usuario" name="username" autocomplete="username" maxlength="16" autocapitalize="none" spellcheck="false" required />
        <label for="senha">Senha</label>
        <input id="senha" name="password" type="password" autocomplete="current-password" minlength="6" required />
        <button type="submit">Entrar</button>
        <p id="erro" role="alert"></p>
        <small>Primeira vez? Escolha um usuário e uma senha: a conta é criada na hora. A senha é embaralhada no seu navegador antes de sair daqui.</small>
      </div>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
